extends: ../full_aslc/E04_seed17.yaml
experiment:
  id: E04_aslc3000_retrieval
  output_dir: artifacts/aslc3000/E04_seed17
  evaluation_protocol: asl_citizen_official_signer_disjoint_ASLC300_v1
data:
  train_manifest: data/aslc3000/manifests/train.jsonl
  val_manifest: data/aslc3000/manifests/val.jsonl
  # The ASLC300 reference evaluation has no test stage.
  test_manifest: data/aslc3000/manifests/test_not_requested.jsonl
  num_workers: 1
cache:
  root: data/aslc3000/cache
geometry:
  projection:
    statistics_path: data/aslc3000/targets/logsig_stats.npz
    matrices_path: data/aslc3000/targets/logsig_matrices.npz
training:
  # Same successful-update/effective-batch budgets as proposal11 peers.
  max_successful_steps: 4000
  validation_interval: 4000
  diagnostic_interval: 1000
  checkpoint_interval: 1000
runtime:
  max_runtime_hours: 48.0
