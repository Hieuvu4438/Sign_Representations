schema_version: 1
aggregate: results/confirmatory_results.json
state: docs/STATE.md
limitations:
- Custom frozen 40-gloss K=1 subset with 80 dev queries; not the full ASL Citizen
  benchmark or the previous pilot protocol.
- Only 47 continuous segmented SSL clips train and three held-out SSL dev clips; rank
  diagnostics are sample limited.
- Existing How2Sign segmentation boundaries contribute a prior; captions and lexical
  labels are not read for SSL.
- SSL signer identity and lexical overlap are unknown; query-gallery signer disjointness
  is verified separately.
- Generic DINO appearance cosine and noisy MediaPipe crops are visual proxies, not
  expert phonological annotation.
- Natural minimal-pair evaluation is BLOCKED_EXTERNAL; no phonology improvement claim
  is supported.
- External pretrained SignRep and SHuBERT comparisons are not run in this causal pilot;
  no published score is copied into a same-protocol table.
- Pilot dev CIs describe evaluation-gloss sampling at fixed checkpoints; multi-seed
  confirmation and broader benchmarks are required for strong claims.
- Matrix uses a separate fixed400-update horizon selected by a timing-only budget
  rule; it is not the1000-update pilot. Mechanism controls A2/A3/A6 each have one
  seed; H1 has three paired seeds if complete.
output: results/confirmatory_report.md
