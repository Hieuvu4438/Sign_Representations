[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonopath-jepa"
version = "0.1.0"
description = "PhonoPath-JEPA implementation of proposal16 v1.1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "scikit-learn>=1.3", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
oracle = ["pysiglib==4.0.0"]

[tool.setuptools.packages.find]
include = ["pp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
