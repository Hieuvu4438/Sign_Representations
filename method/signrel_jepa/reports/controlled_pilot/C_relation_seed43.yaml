articulators:
  confidence_threshold: 0.5
  membership: intersection
data:
  augment: true
  batch_size_per_gpu: 2
  crop_size: 384
  heldout_manifests:
  - manifests/wlasl_all.jsonl
  - manifests/eval_pilot/asl_citizen_train.jsonl
  - manifests/eval_pilot/asl_citizen_val.jsonl
  - manifests/eval_pilot/asl_citizen_test.jsonl
  manifest: manifests/how2sign_mvp_ready_v2.jsonl
  num_frames: 16
  num_workers: 2
  require_landmarks: true
  sampling_stride: 2
ema:
  end: 1.0
  schedule: cosine
  start: 0.996
experiment:
  name: jepa_plus_relation
  scope: fixed pilot; not full benchmark or paper validation
loss:
  articulator_weight: 0.0
  generic_weight: 1.0
  normalize: layernorm
  regularization:
    enabled: false
  relation_weight: 1.0
  type: l1
masking:
  hidden_ratio: 0.65
  min_visible_ratio: 0.25
  mixture:
    articulator: 0.0
    motion_salient: 0.0
    random_multiblock: 1.0
    relation_break: 0.0
  span_fraction: 0.5
model:
  backbone:
    architecture: vit_base
    checkpoint: assets/vjepa2_1_vitb_dist_vitG_384.pt
    checkpoint_key: ema_encoder
    checkpointing: true
    crop_size: 384
    expected_sha256: 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
    family: vjepa2_1
    num_frames: 16
    patch: 16
    provider: vjepa2
    tubelet: 2
  predictor:
    depth: 2
    heads: 6
    width: 384
  relation_dim: 384
  temporal_scales:
  - kernel: 1
    name: short
    weight: 1.0
optimizer:
  betas:
  - 0.9
  - 0.95
  lr: 0.0001
  weight_decay: 0.04
scheduler:
  warmup_fraction: 0.05
seed: 43
trainer:
  accumulate_steps: 2
  checkpoint_every: 200
  collapse_alarm:
    patience: 100
    std_threshold: 1.0e-05
  deterministic: false
  device: cuda
  grad_clip_norm: 1.0
  log_every: 20
  max_steps: 200
  precision: bf16
  run_dir: runs/controlled_pilot/C_relation_seed43
