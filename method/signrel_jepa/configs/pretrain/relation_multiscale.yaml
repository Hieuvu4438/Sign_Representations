extends: relation_mvp.yaml
experiment:
  name: relation_multiscale
  scope: phase 2; run only after frozen evaluation supports the single-scale hypothesis
data: {num_frames: 32}
model:
  backbone: {num_frames: 32}
  temporal_scales:
    - {name: short, kernel: 1, weight: 1.0}
    - {name: medium, kernel: 4, weight: 1.0}
    - {name: long, kernel: 8, weight: 1.0}
trainer: {run_dir: runs/relation_multiscale}
