extends: debug_tiny.yaml
experiment:
  name: signrel_relation_mvp
  scope: single-scale continued SSL from V-JEPA 2.1
data:
  manifest: manifests/how2sign_mvp_ready_v2.jsonl
  num_frames: 16
  crop_size: 384
  batch_size_per_gpu: 2
  num_workers: 2
model:
  backbone:
    provider: vjepa2
    family: vjepa2_1
    architecture: vit_base
    crop_size: 384
    num_frames: 16
    patch: 16
    tubelet: 2
    checkpointing: true
    checkpoint: assets/vjepa2_1_vitb_dist_vitG_384.pt
    expected_sha256: 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
    checkpoint_key: ema_encoder
  relation_dim: 384
  predictor: {width: 384, heads: 6, depth: 2}
trainer:
  run_dir: runs/relation_mvp
  device: cuda
  max_steps: 50000
  precision: bf16
  deterministic: false
  log_every: 20
  checkpoint_every: 2000
